name: Sourcewell checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENAI_API_KEY: ""
      ADMIN_TOKEN: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --frozen --extra dev
      - run: uv run ruff check backend scripts
      - run: uv run python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm typecheck && pnpm lint && pnpm build
        working-directory: frontend
      - run: pnpm exec playwright install --with-deps chromium
        working-directory: frontend
      - run: pnpm test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: frontend/test-results/
          retention-days: 7
  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t sourcewell-ci .
      - name: Start public demo without provider credentials
        run: >-
          docker run -d --name sourcewell-ci -p 127.0.0.1:8003:8000
          -v sourcewell-ci-data:/app/data
          -e APP_MODE=public -e COOKIE_SECURE=true -e PUBLIC_ORIGIN=https://sourcewell-ci.example
          sourcewell-ci
      - name: Verify container readiness and recorded mode
        run: python scripts/check_container.py
      - name: Container diagnostics
        if: failure()
        run: docker logs sourcewell-ci
      - name: Stop test container
        if: always()
        run: docker rm -f sourcewell-ci
