[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sourcewell"
version = "0.1.0"
description = "Evidence-first support with hybrid retrieval and honest evaluations"
requires-python = ">=3.11,<3.14"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1", "chromadb>=1.0,<2", "rank-bm25>=0.2.2,<1",
  "openai>=2,<3", "pypdf>=6,<7", "httpx>=0.28,<1"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.setuptools.packages.find]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
